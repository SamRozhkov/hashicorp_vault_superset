# The openmetadata chart's pipelineServiceClientConfig.airflow.auth expects a
# pre-existing secret with the Airflow admin password (used by OpenMetadata
# to call the Airflow REST API). Nothing in the openmetadata or
# openmetadata-dependencies charts creates it automatically, so it must be
# applied by hand before/alongside the ArgoCD Application. Value here must
# match dependencies-values.yaml's airflow.createUserJob.defaultUser.password.
apiVersion: v1
kind: Secret
metadata:
  name: airflow-secrets
  namespace: openmetadata
type: Opaque
stringData:
  openmetadata-airflow-password: admin
